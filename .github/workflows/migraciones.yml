name: Migraciones

# Solo manual: las migraciones nunca corren solas.
# El Environment pagos-produccion guarda los secretos y exige su aprobacion.
on:
  workflow_dispatch:

permissions:
  contents: read

# Nunca se cancela una migracion a mitad de camino: las corridas hacen cola.
concurrency:
  group: migraciones
  cancel-in-progress: false

jobs:
  aplicar:
    runs-on: ubuntu-latest
    environment: pagos-produccion
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # El script solo imprime el nombre de las migraciones aplicadas.
      # No vuelca filas, ni la URL de la base, ni el token.
      - name: Aplicar migraciones pendientes
        env:
          PAGOS_TURSO_URL: ${{ secrets.PAGOS_TURSO_URL }}
          PAGOS_TURSO_TOKEN: ${{ secrets.PAGOS_TURSO_TOKEN }}
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/migrate.ts
